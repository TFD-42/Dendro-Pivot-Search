<!DOCTYPE html>
<html lang="en">
<head><title>DuckDuckGo Lite</title></head>
<body>
<div class="filters"></div>
<table summary="DuckDuckGo search results">
<tr>
  <td class="result-title">
    <a class="result-link" href="https://example.com/ddg-page1">DDG Result One</a>
    <span class="result-extras-url">example.com</span>
  </td>
</tr>
<tr>
  <td class="result-snippet">First DDG result about Python &amp; programming.</td>
</tr>
<tr>
  <td class="result-title">
    <a class="result-link" href="https://example.org/ddg-page2">DDG Result Two</a>
    <span class="result-extras-url">example.org</span>
  </td>
</tr>
<tr>
  <td class="result-snippet">Second result snippet with <b>bold</b> markup.</td>
</tr>
<tr>
  <td class="result-title">
    <a class="result-link" href="https://test.example.com/ddg-page3">DDG Result Three No Snippet</a>
    <span class="result-extras-url">test.example.com</span>
  </td>
</tr>
<tr>
  <td class="result-snippet"></td>
</tr>
</table>
</body>
</html>
