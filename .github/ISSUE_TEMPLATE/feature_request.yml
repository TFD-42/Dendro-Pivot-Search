name: Feature request
description: Propose an improvement or a new capability
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checks
      options:
        - label: I searched existing issues and discussions for a similar request.
          required: true
        - label: The proposal keeps DendroPivot dependency-free (Python standard library only), or explains why not.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or use case motivates this request?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Expected behavior, CLI flags or UI changes.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Search backends
        - Query expansion (heuristic / Ollama)
        - Terminal UI
        - Local web view
        - JSON / HTML output
        - Platform support (Termux, Windows, macOS)
        - Documentation
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a pull request for this.
