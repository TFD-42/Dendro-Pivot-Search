[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dendropivot"
version = "1.1.0"
description = "Arborescent web search tool with Ollama query expansion"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dendropivot = "websearch:main"
dendropivot-launcher = "launcher:main"

[tool.setuptools]
py-modules = ["websearch", "launcher"]
