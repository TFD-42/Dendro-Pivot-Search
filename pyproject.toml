[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dendropivot"
version = "1.1.0"
description = "Privacy-first local web search explorer for Python — no API key, optional Ollama, Python stdlib only"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dendropivot = "websearch:main"
dendropivot-launcher = "launcher:main"

[tool.setuptools]
py-modules = ["websearch", "launcher"]
